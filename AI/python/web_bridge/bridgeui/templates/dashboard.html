<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai_dc2 Strategy Bridge</title>
<style>
  :root {
    --bg: #11151c;
    --panel: #181d27;
    --panel2: #1d2330;
    --line: rgba(255,255,255,0.08);
    --text: #e5e7eb;
    --muted: #8b93a7;
    --accent: #4aa3ff;
    --good: #2dd4bf;
    --warn: #f59e0b;
    --bad: #fb7185;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(74,163,255,0.12), transparent 28%),
      radial-gradient(circle at bottom right, rgba(45,212,191,0.08), transparent 25%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(10, 14, 20, 0.82);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
  .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(74,163,255,0.12);
    color: var(--accent);
    font-size: 12px;
    border: 1px solid rgba(74,163,255,0.22);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); }
  main {
    display: block;
    padding: 14px;
  }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 30%), var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    min-width: 0;
  }
  .card h2 {
    margin: 0;
    padding: 14px 16px 10px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
  }
  .card-body { padding: 10px 12px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }
  .metric {
    padding: 7px 8px;
    border-radius: 8px;
    background: var(--panel2);
    border: 1px solid var(--line);
    min-height: 44px;
  }
  .metric .label { color: var(--muted); font-size: 10px; margin-bottom: 3px; line-height: 1.1; }
  .metric .value { font-size: 13px; font-weight: 700; word-break: break-word; line-height: 1.15; }
  .metric .value.small { font-size: 12px; font-weight: 600; }
  .stack { display: grid; gap: 8px; }
  .form-row { display: grid; gap: 6px; }
  label { color: var(--muted); font-size: 11px; }
  input, textarea, select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #0f131a;
    color: var(--text);
    padding: 7px 9px;
    font: inherit;
    outline: none;
  }
  textarea { min-height: 72px; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: rgba(74,163,255,0.5); }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    border: 1px solid rgba(74,163,255,0.22);
    background: rgba(74,163,255,0.12);
    color: var(--accent);
    border-radius: 8px;
    padding: 7px 9px;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    font-size: 12px;
    line-height: 1.15;
  }
  button.secondary {
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-color: var(--line);
  }
  button.danger {
    background: rgba(251,113,133,0.14);
    color: var(--bad);
    border-color: rgba(251,113,133,0.25);
  }
  button:hover { filter: brightness(1.1); }
  .events {
    max-height: 58vh;
    overflow: auto;
    display: grid;
    gap: 8px;
  }
  .log-tabs {
    display: flex;
    gap: 6px;
    padding: 4px 0 2px;
  }
  .log-tab-btn {
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-radius: 999px;
    padding: 5px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
  }
  .log-tab-btn.active {
    border-color: rgba(74,163,255,0.5);
    background: rgba(74,163,255,0.16);
    color: var(--accent);
  }
  .log-panel { display: none; }
  .log-panel.active { display: grid; gap: 6px; }
  .event {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: start;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--panel2);
    border: 1px solid var(--line);
    font-family: Consolas, monospace;
    font-size: 11px;
  }
  .event-main { min-width: 0; }
  .event-head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); margin-bottom: 4px; font-size: 10px; }
  .event-name { color: var(--accent); font-weight: 700; }
  .event-json { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cbd5e1; }
  .copy-btn {
    white-space: nowrap;
    align-self: center;
    padding: 5px 8px;
    font-size: 11px;
  }
  .muted { color: var(--muted); }
  .tabs {
    display: flex;
    gap: 8px;
    padding: 8px 10px 0;
  }
  .tab-btn {
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-radius: 10px;
    padding: 6px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
  }
  .tab-btn.active {
    border-color: rgba(74,163,255,0.5);
    background: rgba(74,163,255,0.16);
    color: var(--accent);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    background: #0f131a;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    color: #cbd5e1;
    overflow: auto;
  }
  .raw-state details {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #0f131a;
    padding: 6px;
  }
  .raw-state summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 6px;
  }
  .raw-state pre {
    max-height: 130px;
    overflow: auto;
    padding: 8px;
  }
  @media (max-width: 980px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric { min-height: 40px; }
    h1 { font-size: 16px; }
    .sub { display: none; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>ai_dc2 Web Bridge</h1>
    <div class="sub">현재 실행중인 전략만 선택하는 최소 대시보드</div>
  </div>
  <div class="pill"><span id="liveDot" class="dot"></span><span id="liveText">connecting</span></div>
</header>
<main>
  <section class="card">
    <h2>Current Strategy</h2>
    <div class="card-body stack">
      <div class="grid">
        <div class="metric"><div class="label">Status</div><div class="value small" id="statusValue">-</div></div>
        <div class="metric"><div class="label">Connected</div><div class="value small" id="connectedValue">-</div></div>
        <div class="metric"><div class="label">Race</div><div class="value small" id="raceValue">-</div></div>
        <div class="metric"><div class="label">Strategy</div><div class="value small" id="strategyValue">-</div></div>
        <div class="metric"><div class="label">Mode</div><div class="value small" id="modeValue">-</div></div>
        <div class="metric"><div class="label">Selected</div><div class="value small" id="selectedValue">-</div></div>
        <div class="metric"><div class="label">Policy</div><div class="value small" id="policyValue">-</div></div>
        <div class="metric"><div class="label">Last Action</div><div class="value small" id="lastActionValue">-</div></div>
        <div class="metric"><div class="label">Last Strategy Cmd</div><div class="value small" id="lastStrategyValue">-</div></div>
        <div class="metric"><div class="label">Last Placement</div><div class="value small" id="lastPlacementValue">-</div></div>
      </div>

      <div class="form-row">
        <label for="strategySelect">Strategy Unit</label>
        <select id="strategySelect">
          <option value="auto">auto</option>
          <option value="ProtossStrategy">ProtossStrategy</option>
          <option value="TerranStrategy">TerranStrategy</option>
          <option value="ZergStrategy">ZergStrategy</option>
        </select>
      </div>

      <div class="form-row">
        <label for="openingSelect">Race Strategy</label>
        <select id="openingSelect">
          <option value="">auto</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="secondary" onclick="refreshState()">Refresh</button>
        <button onclick="applySelection()">Apply Selection</button>
      </div>

      <div class="form-row">
        <div class="btn-row">
          <button class="secondary" onclick="clearEvents()">Clear Events</button>
        </div>
        <div class="log-tabs">
          <button class="log-tab-btn active" data-log-tab="received" onclick="switchLogTab('received')">DLL 송신 메시지</button>
          <button class="log-tab-btn" data-log-tab="sent" onclick="switchLogTab('sent')">DLL 수신 메시지</button>
        </div>
        <div class="log-panel active" id="sentEvents"></div>
        <div class="log-panel" id="receivedEvents"></div>
      </div>
    </div>
  </section>
</main>

<script>
const initial = {{ initial_data|safe }};
const sentEventBox = document.getElementById('sentEvents');
const receivedEventBox = document.getElementById('receivedEvents');
const liveDot = document.getElementById('liveDot');
const liveText = document.getElementById('liveText');
let currentState = initial.state || {};
let currentRuntime = initial.runtime || {};
let currentCatalog = null;
const logState = {
  sent: [],
  received: [],
};

function setLive(ok, text) {
  liveDot.classList.toggle('on', !!ok);
  liveText.textContent = text;
}

function renderState() {
  const state = currentState || {};
  const runtime = currentRuntime || {};
  document.getElementById('statusValue').textContent = state.status ?? '-';
  document.getElementById('connectedValue').textContent = String(!!state.connected);
  document.getElementById('raceValue').textContent = state.self_race ?? '-';
  const effectiveOpening = runtime.effective_opening || state.strategy_opening || '-';
  const effectiveMode = runtime.effective_mode || state.strategy_mode || '-';
  document.getElementById('strategyValue').textContent = `${effectiveOpening}`;
  document.getElementById('modeValue').textContent = `${effectiveMode}`;
  const selectedStrategy = runtime.selected_strategy_unit || 'auto';
  document.getElementById('selectedValue').textContent = selectedStrategy;
  document.getElementById('policyValue').textContent = state.policy_running ? 'running' : 'stopped';
  const lastAction = state.last_action || {};
  const lastActionType = lastAction.type || '-';
  document.getElementById('lastActionValue').textContent = lastActionType;
  const lastStrategy = state.last_strategy_command || {};
  const lastPlacement = state.last_placement_policy || {};
  document.getElementById('lastStrategyValue').textContent = lastStrategy.opening || lastStrategy.mode || lastStrategy.type || '-';
  document.getElementById('lastPlacementValue').textContent = lastPlacement.plan || lastPlacement.wall_policy || lastPlacement.type || '-';
}

function eventDirection(event) {
  if (!event) {
    return 'received';
  }
  return event.source === 'game' ? 'received' : 'sent';
}

function compactJson(value) {
  try {
    return JSON.stringify(value);
  } catch (err) {
    return String(value);
  }
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    setLive(true, 'copied');
  } catch (err) {
    setLive(false, 'copy failed');
  }
}

function createLogEventNode(event) {
  const wrap = document.createElement('div');
  wrap.className = 'event';

  const main = document.createElement('div');
  main.className = 'event-main';

  const head = document.createElement('div');
  head.className = 'event-head';
  const name = document.createElement('span');
  name.className = 'event-name';
  name.textContent = event.event || 'unknown';
  const stamp = document.createElement('span');
  stamp.textContent = `${event.time || ''} #${event.frame ?? ''}`;
  head.appendChild(name);
  head.appendChild(stamp);

  const json = document.createElement('div');
  json.className = 'event-json';
  json.textContent = compactJson(event);

  main.appendChild(head);
  main.appendChild(json);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'secondary copy-btn';
  copyBtn.textContent = 'Copy';
  copyBtn.onclick = () => copyText(compactJson(event));

  wrap.appendChild(main);
  wrap.appendChild(copyBtn);
  return wrap;
}

function renderLogPanel(kind) {
  const box = kind === 'sent' ? sentEventBox : receivedEventBox;
  if (!box) {
    return;
  }
  box.innerHTML = '';
  const events = logState[kind] || [];
  events.slice().reverse().forEach((event) => {
    box.appendChild(createLogEventNode(event));
  });
}

function pushLogEvent(event) {
  const kind = eventDirection(event);
  const bucket = logState[kind];
  bucket.push(event);
  while (bucket.length > 60) {
    bucket.shift();
  }
  renderLogPanel(kind);
}

function switchLogTab(kind) {
  document.querySelectorAll('.log-tab-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.logTab === kind);
  });
  document.querySelectorAll('.log-panel').forEach((panel) => {
    panel.classList.toggle('active', panel.id === `${kind}Events`);
  });
}

function openingRaceKey() {
  return currentState.self_race || '';
}

function populateStrategyOptions(units, selected) {
  const select = document.getElementById('strategySelect');
  select.innerHTML = '';
  const autoOpt = document.createElement('option');
  autoOpt.value = 'auto';
  autoOpt.textContent = 'auto';
  select.appendChild(autoOpt);
  (units || []).forEach((unit) => {
    const opt = document.createElement('option');
    opt.value = unit;
    opt.textContent = unit;
    select.appendChild(opt);
  });
  select.value = selected || 'auto';
}

function populateOpeningOptions() {
  const select = document.getElementById('openingSelect');
  const race = openingRaceKey();
  select.innerHTML = '';

  const autoOpt = document.createElement('option');
  autoOpt.value = '';
  autoOpt.textContent = 'auto';
  select.appendChild(autoOpt);

  if (!race || !currentCatalog || !currentCatalog.opening_catalog || !currentCatalog.opening_catalog.races) {
    return;
  }

  const items = currentCatalog.opening_catalog.races[race] || [];
  if (!items.length) {
    return;
  }

  const group = document.createElement('optgroup');
  group.label = `${race} Strategy`;
  items.forEach((item) => {
    const opt = document.createElement('option');
    opt.value = item.opening;
    opt.textContent = item.implemented ? item.opening : `${item.opening} (template)`;
    group.appendChild(opt);
  });
  select.appendChild(group);

  const openingMap = (currentRuntime && currentRuntime.selected_opening_overrides) || {};
  if (openingMap[race]) {
    select.value = openingMap[race];
  }
}

function addEventItem(event) {
  if (!event) {
    return;
  }
  pushLogEvent(event);
}

function clearEvents() {
  logState.sent = [];
  logState.received = [];
  renderLogPanel('sent');
  renderLogPanel('received');
}

function loadCatalog() {
  return fetch('/api/runtime/catalog/')
    .then(r => r.json())
    .then(data => {
      currentCatalog = data.catalog || null;
      const runtime = currentRuntime || {};
      populateStrategyOptions((currentCatalog && currentCatalog.strategy_units) || [], runtime.selected_strategy_unit || 'auto');
      populateOpeningOptions();
    })
    .catch(err => {
      populateStrategyOptions(['ProtossStrategy', 'TerranStrategy', 'ZergStrategy'], (currentRuntime && currentRuntime.selected_strategy_unit) || 'auto');
      populateOpeningOptions();
      setLive(false, 'catalog error: ' + err);
    });
}

function refreshState() {
  fetch('/api/state/')
    .then(r => r.json())
    .then(data => {
      currentState = data.state || {};
      currentRuntime = data.runtime || {};
      renderState();
      populateStrategyOptions((currentCatalog && currentCatalog.strategy_units) || [], currentRuntime.selected_strategy_unit || 'auto');
      populateOpeningOptions();
      setLive(true, 'connected');
    })
    .catch(err => setLive(false, 'error: ' + err));
}

function applySelection() {
  const race = openingRaceKey();
  const payload = {
    strategy_unit: document.getElementById('strategySelect').value || 'auto',
    opening: document.getElementById('openingSelect').value || '',
    race: race,
  };
  fetch('/api/runtime/select/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(r => r.json()).then(() => refreshState()).catch(err => setLive(false, 'apply failed: ' + err));
}

renderState();
setLive(!!(currentState && currentState.connected), 'connecting');
if (initial.events) {
  initial.events.slice(-12).forEach(addEventItem);
}
loadCatalog().then(refreshState);

const es = new EventSource('/events/stream/');
es.onmessage = function(e) {
  try {
    const message = JSON.parse(e.data);
    if (message.kind === 'snapshot') {
      currentState = message.state || {};
      currentRuntime = message.runtime || currentRuntime;
      renderState();
      setLive(true, 'connected');
      return;
    }
    if (message.kind === 'event' && message.event) {
      addEventItem(message.event);
      currentState = currentState || {};
      if (message.event.event === 'onFrame') {
        currentState.frame = message.event.frame;
      }
      renderState();
      setLive(true, 'streaming');
    }
  } catch (err) {
    setLive(false, 'parse error');
  }
};
es.onerror = function() {
  setLive(false, 'stream offline');
};
</script>
</body>
</html>
